name: Build and Release PhotoStyle

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (.app & CLI)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - name: Install FFmpeg
        run: |
          brew install ffmpeg
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> rust/target"

      - name: Build Rust Core for macOS
        run: |
          cd rust
          XDREMUX_USE_FFMPEG=1 cargo build --release --lib
          cd ..
          mkdir -p Libraries
          cp rust/target/release/libxdremux_core.a Libraries/libxdremux_core.a

      - name: Run Self-Test Suite
        run: |
          swift run photostyle --test

      - name: Build Release Binaries
        run: |
          swift build -c release

      - name: Package macOS Application (.app & CLI)
        run: |
          mkdir -p dist/macos/PhotoStyle.app/Contents/MacOS
          mkdir -p dist/macos/PhotoStyle.app/Contents/Resources
          cp .build/release/PhotoStyleApp dist/macos/PhotoStyle.app/Contents/MacOS/PhotoStyleApp
          cp .build/release/photostyle dist/macos/
          cp Sources/PhotoStyleApp/Info-macOS.plist dist/macos/PhotoStyle.app/Contents/Info.plist

          codesign --force --deep --sign - dist/macos/PhotoStyle.app
          cd dist/macos
          zip -r -y ../../PhotoStyle-macOS-v1.0.zip PhotoStyle.app photostyle
          cd ../..

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: photostyle-macos
          path: PhotoStyle-macOS-v1.0.zip

  build-ios:
    name: Build iOS (.ipa)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install Rust Toolchain for iOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> rust/target"

      - name: Build Rust Core for iOS
        run: |
          cd rust
          XDREMUX_USE_FFMPEG=1 cargo build --target aarch64-apple-ios --release --lib
          cd ..
          mkdir -p Libraries
          cp rust/target/aarch64-apple-ios/release/libxdremux_core.a Libraries/libxdremux_core.a

      - name: Build iOS Application
        run: |
          xcodebuild build \
            -workspace PhotoStyle.xcworkspace \
            -scheme PhotoStyleApp \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package iOS IPA
        run: |
          mkdir -p dist/ios/Payload
          APP_PATH=$(find DerivedData/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            BIN_PATH=$(find DerivedData/Build/Products/Release-iphoneos -name "PhotoStyleApp" -type f | head -n 1)
            mkdir -p dist/ios/Payload/PhotoStyleApp.app
            cp "$BIN_PATH" dist/ios/Payload/PhotoStyleApp.app/
            cp Sources/PhotoStyleApp/Info-iOS.plist dist/ios/Payload/PhotoStyleApp.app/Info.plist
            APP_PATH="dist/ios/Payload/PhotoStyleApp.app"
          else
            cp -r "$APP_PATH" dist/ios/Payload/
            APP_PATH="dist/ios/Payload/$(basename "$APP_PATH")"
          fi

          codesign --force --deep --sign - --entitlements Sources/PhotoStyleApp/Entitlements.plist "$APP_PATH"
          cd dist/ios
          zip -r -y ../../PhotoStyle-iOS-v1.0.ipa Payload
          cd ../..

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: photostyle-ios
          path: PhotoStyle-iOS-v1.0.ipa

  release:
    name: Create & Publish GitHub Release
    needs: [build-macos, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: photostyle-macos
          path: release-assets

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: photostyle-ios
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0' }}
          name: PhotoStyle ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            # PhotoStyle v1.0

            Native Swift application for macOS and iOS to enable native Apple Photos **Photographic Styles**, **Photographic Styles 3 (Texture + Grain)**, and **Apple Portrait Mode** on imported pictures without baking in the look.

            ### Downloads:
            - **macOS Application**: `PhotoStyle-macOS-v1.0.zip` (Contains `PhotoStyle.app` and `photostyle` CLI tool)
            - **iOS Application**: `PhotoStyle-iOS-v1.0.ipa` (Sideloadable via TrollStore, AltStore, Sideloadly, or Apple Configurator)

            ### Credits & Acknowledgements:
            - [**XDRemux**](https://github.com/21Z121Z1/XDRemux) by [@21Z121Z1](https://github.com/21Z121Z1) — Original research and implementation of Apple Photos ISOBMFF metadata parsing, Photographic Styles lattice construction, and Apple Photos container features.
            - [**XDRemux-Flutter**](https://github.com/BeetMan/XDRemux-Flutter) by [@BeetMan](https://github.com/BeetMan) — Cross-platform UI architecture and mobile reference application for XDRemux.
